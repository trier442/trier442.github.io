<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="법과 사회 233문항 온라인 문제풀이">
  <title>법과 사회 온라인 문제풀이</title>
<style>

:root{--bg:#f5f7f8;--card:#fff;--ink:#17212b;--muted:#6b7280;--line:#dfe5e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3;--danger:#b42318;--dangerSoft:#fff1f0;--ok:#067647;--okSoft:#ecfdf3;--shadow:0 12px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.65}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px max(18px,calc((100vw - 1240px)/2));background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.brand-wrap{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:serif;font-size:23px;font-weight:700}.topbar h1{font-size:19px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:1px 0 0}.layout{max-width:1240px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px}.sidebar{position:sticky;top:92px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.progress-card{background:var(--soft);border-radius:14px;padding:14px;margin-bottom:16px}.progress-head{display:flex;justify-content:space-between;font-size:14px}.progress-track{height:8px;background:#d5e8e5;border-radius:999px;overflow:hidden;margin:10px 0}.progress-track div{height:100%;width:0;background:var(--brand);transition:.25s}.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.field{display:block;font-size:12px;font-weight:700;color:#49525c;margin:12px 0}.field select{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.primary{background:var(--brand);color:white}.primary:hover{background:var(--brand2)}.secondary{background:#eef2f4;color:#26323c}.secondary:hover{background:#e4eaed}.ghost{background:transparent;border:1px solid var(--line)}.small{padding:8px 11px;font-size:12px}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.number-grid{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:330px;overflow:auto}.number-grid button{padding:7px 3px;font-size:11px;background:#f2f4f5;border:1px solid transparent}.number-grid button.done{background:#eaf7f1;color:var(--ok)}.number-grid button.wrong{background:var(--dangerSoft);color:var(--danger)}.number-grid button.current{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.hidden{display:none!important}.quiz-panel{min-width:0}.question-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px}.badge{display:inline-flex;align-items:center;background:var(--brand);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.badge.light{background:#e8edf0;color:#475569}.counter{margin-left:auto;color:var(--muted);font-size:13px}.question-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px clamp(18px,3vw,34px);box-shadow:var(--shadow)}.question-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}.question-top strong{font-size:21px}.bookmark{font-size:24px;background:transparent;padding:0;color:#9aa3aa}.bookmark.on{color:#f59e0b}.question-body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:16px}.q-para{margin:10px 0;white-space:normal}.choice-line{padding:3px 0}.view-title{display:inline-block;border:1px solid #111;padding:2px 12px;font-weight:700}.bogi-line{padding-left:8px}.q-image{display:block;max-width:100%;height:auto;margin:14px auto;border-radius:6px}.table-wrap{overflow-x:auto;margin:14px 0}.q-table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}.q-table td{border:1px solid #7f8a93;padding:7px 8px;vertical-align:top}.q-table .q-para{margin:2px 0}.answer-area{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line)}.choice-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice-btn{background:#f5f7f8;border:1px solid var(--line);font-size:18px}.choice-btn.selected{background:var(--soft);border-color:var(--brand);color:var(--brand2)}.subjective-input{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical;font:inherit}.action-row{display:flex;gap:9px;margin-top:14px}.result-box{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:700}.result-box.ok{background:var(--okSoft);color:var(--ok)}.result-box.wrong{background:var(--dangerSoft);color:var(--danger)}.result-box.info{background:#eff6ff;color:#1d4ed8}.explanation{margin-top:14px;background:#fbfcfd;border:1px solid var(--line);border-radius:14px;padding:18px}.explanation:before{content:'정답 및 해설';display:block;font-weight:800;color:var(--brand2);margin-bottom:10px}.explanation .q-para{margin:8px 0}.nav-row{display:flex;justify-content:space-between;margin:14px 0 40px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}u{text-underline-offset:3px;text-decoration-thickness:1.3px}mark{background:#ececec;padding:0 2px}
@media(max-width:860px){.layout{grid-template-columns:1fr;margin-top:14px}.sidebar{position:static}.topbar{padding:10px 14px}.topbar h1{font-size:16px}.topbar p{display:none}.question-card{padding:18px 15px}.choice-buttons{grid-template-columns:repeat(5,1fr)}.sidebar{padding:14px}.number-grid{grid-template-columns:repeat(8,1fr)}}
@media(max-width:520px){.brand-mark{width:36px;height:36px}.ghost.small{display:none}.layout{padding:0 10px}.question-body{font-size:15px}.choice-buttons{gap:5px}.choice-btn{padding:10px 4px}.action-row{display:grid;grid-template-columns:1fr 1fr}.q-table{min-width:430px}.number-grid{grid-template-columns:repeat(6,1fr)}}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">法</div>
      <div><h1>법과 사회 온라인 문제풀이</h1><p>233문항 · 8개 주제 · 정답/해설 제공</p></div>
    </div>
    <button id="resetBtn" class="ghost small">진도 초기화</button>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <section class="progress-card">
        <div class="progress-head"><strong>학습 진도</strong><span id="progressText">0 / 233</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <div class="stats"><span>정답 <b id="correctStat">0</b></span><span>오답 <b id="wrongStat">0</b></span><span>미채점 <b id="pendingStat">233</b></span></div>
      </section>

      <label class="field">주제
        <select id="sectionFilter"><option value="all">전체 주제</option></select>
      </label>
      <label class="field">학습 모드
        <select id="modeFilter">
          <option value="all">전체 문제</option>
          <option value="unseen">미풀이 문제</option>
          <option value="wrong">오답 문제</option>
          <option value="subjective">서술형만</option>
        </select>
      </label>
      <div class="side-actions">
        <button id="randomBtn" class="secondary">무작위 문제</button>
        <button id="listBtn" class="secondary">번호 목록</button>
      </div>
      <div id="numberGrid" class="number-grid hidden"></div>
    </aside>

    <section class="quiz-panel">
      <div class="question-meta">
        <span id="sectionBadge" class="badge"></span>
        <span id="typeBadge" class="badge light"></span>
        <span id="qCounter" class="counter"></span>
      </div>
      <article class="question-card">
        <div class="question-top"><strong id="questionNum"></strong><button id="bookmarkBtn" class="bookmark" aria-label="북마크">☆</button></div>
        <div id="questionBody" class="question-body"></div>
        <div id="answerArea" class="answer-area"></div>
        <div class="action-row">
          <button id="checkBtn" class="primary">정답 확인</button>
          <button id="explainBtn" class="secondary">정답·해설 보기</button>
        </div>
        <div id="resultBox" class="result-box hidden"></div>
        <div id="explanation" class="explanation hidden"></div>
      </article>
      <nav class="nav-row">
        <button id="prevBtn" class="secondary">← 이전</button>
        <button id="nextBtn" class="primary">다음 →</button>
      </nav>
    </section>
  </main>

  <div id="toast" class="toast"></div>
<script src="images-1.js"></script>
<script src="images-2.js"></script>
<script src="images-3.js"></script>
<script src="images-4.js"></script>
<script src="images-5.js"></script>
<script>window.QUESTION_IMAGES=Object.assign({},window.QUESTION_IMAGES_1||{},window.QUESTION_IMAGES_2||{},window.QUESTION_IMAGES_3||{},window.QUESTION_IMAGES_4||{},window.QUESTION_IMAGES_5||{});</script>
<script src="questions-1.js"></script>
<script src="questions-2.js"></script>
<script src="questions-3.js"></script>
<script src="questions-4.js"></script>
<script>window.QUESTIONS=[].concat(window.QUESTIONS_1||[],window.QUESTIONS_2||[],window.QUESTIONS_3||[],window.QUESTIONS_4||[]);</script>
<script>

const Q=window.QUESTIONS||[];
const IMG=window.QUESTION_IMAGES||{};
const KEY='lawSocietyProgressV1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let filtered=[...Q];
let currentIndex=0;
const circ=['','①','②','③','④','⑤'];
const el=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats();renderGrid();}
function record(id,patch){state[id]={...(state[id]||{}),...patch};save();}
function hydrateImages(root){root.querySelectorAll('img[data-img]').forEach(im=>{const k=im.dataset.img;if(IMG[k])im.src=IMG[k];});}
function sections(){return [...new Set(Q.map(q=>q.section).filter(Boolean))];}
function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function filteredSet(){
 const sec=el('sectionFilter').value, mode=el('modeFilter').value;
 filtered=Q.filter(q=>{
  if(sec!=='all'&&q.section!==sec)return false;
  const s=state[q.id]||{};
  if(mode==='unseen'&&s.seen)return false;
  if(mode==='wrong'&&s.result!=='wrong')return false;
  if(mode==='subjective'&&q.type!=='subjective')return false;
  return true;
 });
 if(!filtered.length){filtered=[...Q];toast('조건에 맞는 문제가 없어 전체 문제를 표시합니다.')}
 currentIndex=Math.min(currentIndex,filtered.length-1);render();
}
function updateStats(){
 const vals=Object.values(state);const seen=vals.filter(x=>x.seen).length;const c=vals.filter(x=>x.result==='correct').length;const w=vals.filter(x=>x.result==='wrong').length;
 el('progressText').textContent=`${seen} / ${Q.length}`;el('progressBar').style.width=`${seen/Q.length*100}%`;el('correctStat').textContent=c;el('wrongStat').textContent=w;el('pendingStat').textContent=Q.length-seen;
}
function renderGrid(){
 const g=el('numberGrid');g.innerHTML='';filtered.forEach((q,i)=>{const b=document.createElement('button');b.textContent=q.num;const s=state[q.id]||{};if(s.seen)b.classList.add('done');if(s.result==='wrong')b.classList.add('wrong');if(i===currentIndex)b.classList.add('current');b.onclick=()=>{currentIndex=i;render();};g.appendChild(b)});
}
function render(){
 if(!filtered.length)return;const q=filtered[currentIndex];const s=state[q.id]||{};
 recordSeenQuiet(q.id);
 el('sectionBadge').textContent=q.sectionShort||q.section||'법과 사회';el('typeBadge').textContent=q.type==='mc'?'객관식':'서술형';el('qCounter').textContent=`${currentIndex+1} / ${filtered.length}`;el('questionNum').textContent=`문제 ${q.num}`;
 el('questionBody').innerHTML=q.html||'<p>문제 내용이 없습니다.</p>';hydrateImages(el('questionBody'));
 el('bookmarkBtn').classList.toggle('on',!!s.bookmark);el('bookmarkBtn').textContent=s.bookmark?'★':'☆';
 const aa=el('answerArea');
 if(q.type==='mc'){
  aa.innerHTML='<div class="choice-buttons">'+[1,2,3,4,5].map(n=>`<button class="choice-btn ${s.choice===n?'selected':''}" data-choice="${n}">${circ[n]}</button>`).join('')+'</div>';
  aa.querySelectorAll('.choice-btn').forEach(b=>b.onclick=()=>{record(q.id,{choice:+b.dataset.choice,seen:true});renderAnswerOnly();});
  el('checkBtn').textContent='채점하기';
 }else{
  aa.innerHTML=`<textarea class="subjective-input" placeholder="답안을 작성하세요.">${s.text||''}</textarea>`;aa.querySelector('textarea').oninput=e=>record(q.id,{text:e.target.value,seen:true});el('checkBtn').textContent='작성 완료';
 }
 renderAnswerOnly();
 el('explanation').innerHTML=q.answerHtml||'<p>해설이 수록되어 있지 않습니다.</p>';hydrateImages(el('explanation'));el('explanation').classList.toggle('hidden',!s.explain);
 el('explainBtn').textContent=s.explain?'해설 닫기':'정답·해설 보기';
 el('prevBtn').disabled=currentIndex===0;el('nextBtn').disabled=currentIndex===filtered.length-1;renderGrid();updateStats();window.scrollTo({top:0,behavior:'smooth'});
}
function recordSeenQuiet(id){if(!(state[id]||{}).seen){state[id]={...(state[id]||{}),seen:true};localStorage.setItem(KEY,JSON.stringify(state));}}
function renderAnswerOnly(){const q=filtered[currentIndex],s=state[q.id]||{};document.querySelectorAll('.choice-btn').forEach(b=>b.classList.toggle('selected',+b.dataset.choice===s.choice));const box=el('resultBox');box.className='result-box hidden';box.textContent='';if(s.result==='correct'){box.className='result-box ok';box.textContent='정답입니다.'}else if(s.result==='wrong'){box.className='result-box wrong';box.textContent=q.answerKey?`오답입니다. 정답은 ${circ[q.answerKey]}입니다.`:'오답으로 기록했습니다.'}else if(s.result==='self'){box.className='result-box info';box.textContent='서술형 답안을 작성했습니다. 해설과 비교해 확인하세요.'}}
el('checkBtn').onclick=()=>{const q=filtered[currentIndex],s=state[q.id]||{};if(q.type==='mc'){if(!s.choice){toast('먼저 답을 선택하세요.');return;}if(!q.answerKey){record(q.id,{result:'self',seen:true,explain:true});toast('해설과 비교해 확인하세요.');}else{record(q.id,{result:s.choice===q.answerKey?'correct':'wrong',seen:true,explain:true});}render();}else{if(!(s.text||'').trim()){toast('답안을 먼저 작성하세요.');return;}record(q.id,{result:'self',seen:true,explain:true});render();}};
el('explainBtn').onclick=()=>{const q=filtered[currentIndex],s=state[q.id]||{};record(q.id,{explain:!s.explain,seen:true});render();};
el('bookmarkBtn').onclick=()=>{const q=filtered[currentIndex],s=state[q.id]||{};record(q.id,{bookmark:!s.bookmark});render();};
el('prevBtn').onclick=()=>{if(currentIndex>0){currentIndex--;render();}};el('nextBtn').onclick=()=>{if(currentIndex<filtered.length-1){currentIndex++;render();}};
el('randomBtn').onclick=()=>{currentIndex=Math.floor(Math.random()*filtered.length);render();};el('listBtn').onclick=()=>el('numberGrid').classList.toggle('hidden');
el('sectionFilter').onchange=filteredSet;el('modeFilter').onchange=filteredSet;
el('resetBtn').onclick=()=>{if(confirm('저장된 풀이 진도와 오답 기록을 모두 초기화할까요?')){state={};localStorage.removeItem(KEY);filteredSet();}};
const sf=el('sectionFilter');sections().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sf.appendChild(o)});filteredSet();

</script>
</body>
</html>
