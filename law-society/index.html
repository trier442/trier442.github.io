<html lang="ko">
<head>

<title>법과 사회 온라인 문제풀이</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#17212b;--muted:#6b7280;--line:#dfe5e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3;--danger:#b42318;--dangerSoft:#fff1f0;--ok:#067647;--okSoft:#ecfdf3;--blue:#1d4ed8;--blueSoft:#eff6ff;--shadow:0 12px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.65}.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px max(18px,calc((100vw - 1280px)/2));background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.brand-wrap{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:serif;font-size:23px;font-weight:700}.topbar h1{font-size:19px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:1px 0 0}.layout{max-width:1280px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px}.sidebar{position:sticky;top:92px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);max-height:calc(100vh - 112px);overflow:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.panel.soft{background:var(--soft);border-color:#cfe6e2}.panel h3{font-size:14px;margin:0 0 10px}.progress-head{display:flex;justify-content:space-between;font-size:14px}.progress-track{height:8px;background:#d5e8e5;border-radius:999px;overflow:hidden;margin:10px 0}.progress-track div{height:100%;width:0;background:var(--brand);transition:.25s}.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.field{display:block;font-size:12px;font-weight:700;color:#49525c;margin:12px 0}.field select{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.primary{background:var(--brand);color:white}.primary:hover{background:var(--brand2)}.secondary{background:#eef2f4;color:#26323c}.secondary:hover{background:#e4eaed}.ghost{background:transparent;border:1px solid var(--line)}.danger{background:var(--dangerSoft);color:var(--danger)}.small{padding:8px 11px;font-size:12px}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.session-list{display:grid;gap:7px}.session-row{display:grid;grid-template-columns:48px 1fr 58px;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.session-row:hover{border-color:#aacfc9}.session-row.active{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.session-row strong{font-size:13px}.session-row span{font-size:11px;color:var(--muted)}.session-score{text-align:right;font-weight:800;color:var(--brand2)!important}.number-grid{margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.number-grid button{padding:7px 3px;font-size:11px;background:#f2f4f5;border:1px solid transparent}.number-grid button.answered{background:#eaf7f1;color:var(--ok)}.number-grid button.wrong{background:var(--dangerSoft);color:var(--danger)}.number-grid button.correct{background:var(--okSoft);color:var(--ok)}.number-grid button.current{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.hidden{display:none!important}.quiz-panel{min-width:0}.hero{background:linear-gradient(135deg,#0f766e,#155e75);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow)}.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:rgba(255,255,255,.84);font-size:14px}.hero .hero-bottom{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}.hero-chip{background:rgba(255,255,255,.16);padding:6px 10px;border-radius:999px;font-size:12px}.score-banner{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;box-shadow:var(--shadow)}.score-circle{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand2);font-size:24px;font-weight:900}.score-info h3{margin:0 0 4px;font-size:17px}.score-info p{margin:0;color:var(--muted);font-size:13px}.score-actions{display:flex;gap:8px;flex-wrap:wrap}.question-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px}.badge{display:inline-flex;align-items:center;background:var(--brand);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.badge.light{background:#e8edf0;color:#475569}.counter{margin-left:auto;color:var(--muted);font-size:13px}.question-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px clamp(18px,3vw,34px);box-shadow:var(--shadow)}.question-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}.question-top strong{font-size:21px}.bookmark{font-size:24px;background:transparent;padding:0;color:#9aa3aa}.bookmark.on{color:#f59e0b}.question-body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:16px}.q-para{margin:10px 0;white-space:normal}.choice-line{padding:3px 0}.view-title{display:inline-block;border:1px solid #111;padding:2px 12px;font-weight:700}.bogi-line{padding-left:8px}.q-image{display:block;max-width:100%;height:auto;margin:14px auto;border-radius:6px}.table-wrap{overflow-x:auto;margin:14px 0}.q-table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}.q-table td{border:1px solid #7f8a93;padding:7px 8px;vertical-align:top}.q-table .q-para{margin:2px 0}.answer-area{margin-top:24px;padding-top:18px;border-top:1px dashed var(--line)}.choice-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice-btn{background:#f5f7f8;border:1px solid var(--line);font-size:18px}.choice-btn.selected{background:var(--soft);border-color:var(--brand);color:var(--brand2)}.choice-btn.correct{background:var(--okSoft);border-color:#86d3ae;color:var(--ok)}.choice-btn.wrong{background:var(--dangerSoft);border-color:#efb1ab;color:var(--danger)}.subjective-input{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical;font:inherit}.action-row{display:flex;gap:9px;margin-top:14px}.result-box{margin-top:14px;border-radius:12px;padding:12px 14px;font-weight:700}.result-box.ok{background:var(--okSoft);color:var(--ok)}.result-box.wrong{background:var(--dangerSoft);color:var(--danger)}.result-box.info{background:var(--blueSoft);color:var(--blue)}.explanation{margin-top:14px;background:#fbfcfd;border:1px solid var(--line);border-radius:14px;padding:18px}.explanation:before{content:'정답 및 해설';display:block;font-weight:800;color:var(--brand2);margin-bottom:10px}.explanation .q-para{margin:8px 0}.nav-row{display:flex;justify-content:space-between;gap:10px;margin:14px 0 18px}.submit-bar{position:sticky;bottom:12px;z-index:10;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 12px 32px rgba(15,23,42,.15);display:flex;justify-content:space-between;align-items:center;gap:12px}.submit-bar p{margin:0;font-size:13px;color:var(--muted)}.submit-bar strong{color:var(--ink)}.composition{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.composition span{font-size:10px;background:#f2f5f6;color:#52606b;padding:4px 7px;border-radius:999px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}u{text-underline-offset:3px;text-decoration-thickness:1.3px}mark{background:#ececec;padding:0 2px}
@media(max-width:900px){.layout{grid-template-columns:1fr;margin-top:14px}.sidebar{position:static;max-height:none}.topbar{padding:10px 14px}.topbar h1{font-size:16px}.topbar p{display:none}.question-card{padding:18px 15px}.number-grid{grid-template-columns:repeat(10,1fr)}.session-list{grid-template-columns:repeat(3,1fr)}.session-row{grid-template-columns:1fr;text-align:center}.session-row span{display:none}.session-score{text-align:center!important}.score-banner{grid-template-columns:auto 1fr}.score-actions{grid-column:1/-1}}@media(max-width:560px){.brand-mark{width:36px;height:36px}.layout{padding:0 10px}.question-body{font-size:15px}.choice-buttons{gap:5px}.choice-btn{padding:10px 4px}.action-row{display:grid;grid-template-columns:1fr 1fr}.q-table{min-width:430px}.number-grid{grid-template-columns:repeat(5,1fr)}.session-list{grid-template-columns:repeat(3,1fr)}.submit-bar{flex-direction:column;align-items:stretch}.submit-bar button{width:100%}.hero{padding:18px}.score-circle{width:66px;height:66px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><div class="brand-mark">法</div><div><h1>법과 사회 온라인 문제풀이</h1><p>9회 × 25문항 · 회차별 100점 자동 채점</p></div></div>
  <button id="resetAllBtn" class="ghost small">전체 기록 초기화</button>
</header>

<main class="layout">
<aside class="sidebar">
  <section class="panel soft">
    <div class="progress-head"><strong>회차별 성적</strong><span id="overallText">0 / 9회 응시</span></div>
    <div class="progress-track"><div id="overallBar"></div></div>
    <div class="stats"><span>평균 <b id="avgStat">-</b></span><span>최고 <b id="bestStat">-</b></span><span>응시 <b id="attemptStat">0회</b></span></div>
  </section>

  <label class="field">학습 방식
    <select id="viewMode">
      <option value="exam">회차별 모의고사</option>
      <option value="bank">전체 문제은행</option>
      <option value="subjective">서술형 연습</option>
    </select>
  </label>

  <div id="examControls">
    <div class="panel">
      <h3>회차 선택</h3>
      <div id="sessionList" class="session-list"></div>
    </div>
  </div>

  <div id="bankControls" class="hidden">
    <label class="field">주제
      <select id="sectionFilter"><option value="all">전체 주제</option></select>
    </label>
    <label class="field">문제 상태
      <select id="bankFilter">
        <option value="all">전체 문제</option>
        <option value="unseen">미풀이 문제</option>
        <option value="wrong">오답 문제</option>
      </select>
    </label>
  </div>

  <div class="side-actions">
    <button id="randomBtn" class="secondary">무작위</button>
    <button id="gridBtn" class="secondary">번호 목록</button>
  </div>
  <div id="numberGrid" class="number-grid"></div>
</aside>

<section class="quiz-panel">
  <section id="examHero" class="hero">
    <h2 id="heroTitle">1회차 모의고사</h2>
    <p>25문항 · 문항당 4점 · 100점 만점 · 8개 단원 모두 포함</p>
    <div class="hero-bottom">
      <span class="hero-chip" id="answeredChip">0 / 25 응답</span>
      <span class="hero-chip" id="attemptChip">첫 응시</span>
    </div>
    <div id="composition" class="composition"></div>
  </section>

  <section id="scoreBanner" class="score-banner hidden">
    <div class="score-circle" id="scoreCircle">0</div>
    <div class="score-info"><h3 id="scoreTitle">채점 결과</h3><p id="scoreDetail"></p></div>
    <div class="score-actions"><button id="retryBtn" class="secondary">다시 풀기</button><button id="reviewWrongBtn" class="primary">오답 보기</button></div>
  </section>

  <div class="question-meta">
    <span id="sectionBadge" class="badge"></span>
    <span id="typeBadge" class="badge light"></span>
    <span id="qCounter" class="counter"></span>
  </div>

  <article class="question-card">
    <div class="question-top"><strong id="questionNum"></strong><button id="bookmarkBtn" class="bookmark" aria-label="북마크">☆</button></div>
    <div id="questionBody" class="question-body"></div>
    <div id="answerArea" class="answer-area"></div>
    <div id="studyActions" class="action-row hidden">
      <button id="checkBtn" class="primary">채점하기</button>
      <button id="explainBtn" class="secondary">정답·해설 보기</button>
    </div>
    <div id="examReviewActions" class="action-row hidden">
      <button id="examExplainBtn" class="secondary">정답·해설 보기</button>
    </div>
    <div id="resultBox" class="result-box hidden"></div>
    <div id="explanation" class="explanation hidden"></div>
  </article>

  <nav class="nav-row"><button id="prevBtn" class="secondary">← 이전</button><button id="nextBtn" class="primary">다음 →</button></nav>

  <div id="submitBar" class="submit-bar">
    <p><strong id="submitStatus">0 / 25문항 응답</strong><br>제출 후 점수와 오답, 해설을 확인할 수 있습니다.</p>
    <button id="submitExamBtn" class="primary">1회차 제출·채점</button>
  </div>
</section>
</main>

<div id="toast" class="toast"></div>

<script src="images-1.js"></script><script src="images-2.js"></script><script src="images-3.js"></script><script src="images-4.js"></script><script src="images-5.js"></script>
<script>window.QUESTION_IMAGES=Object.assign({},window.QUESTION_IMAGES_1||{},window.QUESTION_IMAGES_2||{},window.QUESTION_IMAGES_3||{},window.QUESTION_IMAGES_4||{},window.QUESTION_IMAGES_5||{});</script>
<script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script>
<script>window.QUESTIONS=[].concat(window.QUESTIONS_1||[],window.QUESTIONS_2||[],window.QUESTIONS_3||[],window.QUESTIONS_4||[]);</script>

<script>
(function(){
"use strict";
var Q=window.QUESTIONS||[];
var IMG=window.QUESTION_IMAGES||{};
var EXAM_KEY="lawSocietyExamV3";
var BANK_KEY="lawSocietyProgressV1";
var SESSION_COUNT=9;
var PER_SESSION=25;
var OFFSETS=[0,0,0,0,0,7,8,6];
var examState=safeParse(localStorage.getItem(EXAM_KEY),{sessions:{}});
var bankState=safeParse(localStorage.getItem(BANK_KEY),{});
var currentSession=1;
var currentIndex=0;
var currentList=[];
var bankList=[];
var circ=["","①","②","③","④","⑤"];

function el(id){return document.getElementById(id)}
function safeParse(s,fallback){try{return s?JSON.parse(s):fallback}catch(e){return fallback}}
function saveExam(){localStorage.setItem(EXAM_KEY,JSON.stringify(examState));refreshScores()}
function saveBank(){localStorage.setItem(BANK_KEY,JSON.stringify(bankState))}
function toast(msg){var t=el("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1500)}
function hydrateImages(root){root.querySelectorAll("img[data-img]").forEach(function(im){var k=im.dataset.img;if(IMG[k])im.src=IMG[k]})}
function allSections(){var out=[];Q.forEach(function(q){if(out.indexOf(q.section)<0)out.push(q.section)});return out}
var SECTIONS=allSections();
var BY_ID={};Q.forEach(function(q){BY_ID[q.id]=q});

function buildSessions(){
  var sessions=Array.from({length:SESSION_COUNT},function(){return []});
  SECTIONS.forEach(function(sec,si){
    var arr=Q.filter(function(q){return q.type==="mc"&&q.section===sec});
    var off=OFFSETS[si]||0;
    arr.forEach(function(q,j){sessions[(j+off)%SESSION_COUNT].push(q.id)});
  });
  var fillSections=[SECTIONS[7],SECTIONS[1],SECTIONS[0],SECTIONS[6]];
  var deficitSessions=[];
  sessions.forEach(function(s,i){if(s.length<PER_SESSION)deficitSessions.push(i)});
  deficitSessions.forEach(function(si,di){
    var sec=fillSections[di%fillSections.length];
    var pool=Q.filter(function(q){return q.type==="mc"&&q.section===sec&&sessions[si].indexOf(q.id)<0});
    if(!pool.length)pool=Q.filter(function(q){return q.type==="mc"&&sessions[si].indexOf(q.id)<0});
    sessions[si].push(pool[(si*3+di)%pool.length].id);
  });
  sessions=sessions.map(function(ids,si){
    return ids.slice().sort(function(a,b){
      var ha=(a*53+(si+1)*97)%997;
      var hb=(b*53+(si+1)*97)%997;
      return ha-hb || a-b;
    });
  });
  return sessions;
}
var SESSIONS=buildSessions();

function sessionState(n){
  var k=String(n);
  if(!examState.sessions[k])examState.sessions[k]={answers:{},submitted:false,attempts:[],explain:{}};
  if(!examState.sessions[k].answers)examState.sessions[k].answers={};
  if(!examState.sessions[k].attempts)examState.sessions[k].attempts=[];
  if(!examState.sessions[k].explain)examState.sessions[k].explain={};
  return examState.sessions[k];
}
function sessionQuestions(n){return SESSIONS[n-1].map(function(id){return BY_ID[id]}).filter(Boolean)}
function sessionComposition(n){
  var counts={};sessionQuestions(n).forEach(function(q){counts[q.sectionShort||q.section]=(counts[q.sectionShort||q.section]||0)+1});return counts
}
function latestAttempt(n){var a=sessionState(n).attempts;return a.length?a[a.length-1]:null}
function bestAttempt(n){var a=sessionState(n).attempts;if(!a.length)return null;return a.reduce(function(x,y){return y.score>x.score?y:x})}

function refreshScores(){
  var taken=0,total=0,best=-1,attempts=0;
  for(var n=1;n<=SESSION_COUNT;n++){
    var st=sessionState(n);attempts+=st.attempts.length;
    var lat=latestAttempt(n);if(lat){taken++;total+=lat.score;if(lat.score>best)best=lat.score}
  }
  el("overallText").textContent=taken+" / "+SESSION_COUNT+"회 응시";
  el("overallBar").style.width=(taken/SESSION_COUNT*100)+"%";
  el("avgStat").textContent=taken?Math.round(total/taken)+"점":"-";
  el("bestStat").textContent=best>=0?best+"점":"-";
  el("attemptStat").textContent=attempts+"회";
  renderSessionList();
}
function renderSessionList(){
  var wrap=el("sessionList");wrap.innerHTML="";
  for(var n=1;n<=SESSION_COUNT;n++){
    (function(no){
      var lat=latestAttempt(no);
      var row=document.createElement("div");row.className="session-row"+(no===currentSession?" active":"");
      row.innerHTML="<strong>"+no+"회</strong><span>25문항 · 100점</span><span class='session-score'>"+(lat?lat.score+"점":"미응시")+"</span>";
      row.onclick=function(){switchSession(no)};
      wrap.appendChild(row);
    })(n);
  }
}

function switchSession(n){
  currentSession=n;currentIndex=0;el("viewMode").value="exam";applyMode();render();
}
function examSubmitted(){return !!sessionState(currentSession).submitted}
function answeredCount(){
  var st=sessionState(currentSession);return currentList.reduce(function(c,q){return c+(st.answers[q.id]?1:0)},0)
}
function currentMode(){return el("viewMode").value}

function applyMode(){
  var mode=currentMode();
  el("examControls").classList.toggle("hidden",mode!=="exam");
  el("bankControls").classList.toggle("hidden",mode!=="bank");
  el("examHero").classList.toggle("hidden",mode!=="exam");
  el("submitBar").classList.toggle("hidden",mode!=="exam"||examSubmitted());
  el("scoreBanner").classList.toggle("hidden",mode!=="exam"||!examSubmitted());
  if(mode==="exam"){
    currentList=sessionQuestions(currentSession);
  }else if(mode==="subjective"){
    currentList=Q.filter(function(q){return q.type==="subjective"});
  }else{
    buildBankList();
    currentList=bankList;
  }
  if(!currentList.length)currentList=Q.slice();
  currentIndex=Math.min(currentIndex,currentList.length-1);
  render();
}

function buildBankList(){
  var sec=el("sectionFilter").value;
  var f=el("bankFilter").value;
  bankList=Q.filter(function(q){
    if(sec!=="all"&&q.section!==sec)return false;
    var s=bankState[q.id]||{};
    if(f==="unseen"&&s.seen)return false;
    if(f==="wrong"&&s.result!=="wrong")return false;
    return true;
  });
  if(!bankList.length){toast("조건에 맞는 문제가 없어 전체 문제를 표시합니다.");bankList=Q.slice()}
}

function render(){
  if(!currentList.length)return;
  var mode=currentMode(),q=currentList[currentIndex];
  var exam=mode==="exam",st=exam?sessionState(currentSession):(bankState[q.id]||{});
  var submitted=exam&&st.submitted;
  var choice=exam?st.answers[q.id]:st.choice;

  el("sectionBadge").textContent=q.sectionShort||q.section||"법과 사회";
  el("typeBadge").textContent=q.type==="mc"?"객관식":"서술형";
  el("qCounter").textContent=(currentIndex+1)+" / "+currentList.length;
  el("questionNum").textContent=exam?(currentSession+"회차 · "+(currentIndex+1)+"번"):("문제 "+q.num);
  el("questionBody").innerHTML=q.html||"<p>문제 내용이 없습니다.</p>";hydrateImages(el("questionBody"));

  var book=exam?!!st.bookmarks&&!!st.bookmarks[q.id]:!!st.bookmark;
  el("bookmarkBtn").classList.toggle("on",book);el("bookmarkBtn").textContent=book?"★":"☆";

  var aa=el("answerArea");
  if(q.type==="mc"){
    aa.innerHTML="<div class='choice-buttons'>"+[1,2,3,4,5].map(function(n){
      var cls="choice-btn"+(choice===n?" selected":"");
      if(submitted&&n===q.answerKey)cls+=" correct";
      if(submitted&&choice===n&&choice!==q.answerKey)cls+=" wrong";
      return "<button class='"+cls+"' data-choice='"+n+"'"+(submitted?" disabled":"")+">"+circ[n]+"</button>";
    }).join("")+"</div>";
    aa.querySelectorAll(".choice-btn").forEach(function(b){b.onclick=function(){selectChoice(+b.dataset.choice)}});
  }else{
    var txt=st.text||"";
    aa.innerHTML="<textarea class='subjective-input' placeholder='답안을 작성하세요.'>"+escapeHtml(txt)+"</textarea>";
    aa.querySelector("textarea").oninput=function(e){bankRecord(q.id,{text:e.target.value,seen:true})};
  }

  var result=el("resultBox");result.className="result-box hidden";result.textContent="";
  var exp=el("explanation");exp.innerHTML=q.answerHtml||"<p>해설이 수록되어 있지 않습니다.</p>";hydrateImages(exp);
  var showExp=exam?!!st.explain[q.id]:!!st.explain;exp.classList.toggle("hidden",!showExp);

  if(exam){
    el("studyActions").classList.add("hidden");
    el("examReviewActions").classList.toggle("hidden",!submitted);
    if(submitted){
      if(choice===q.answerKey){result.className="result-box ok";result.textContent="정답입니다. (+4점)"}
      else{result.className="result-box wrong";result.textContent="오답입니다. 정답은 "+circ[q.answerKey]+"입니다."}
      el("examExplainBtn").textContent=showExp?"해설 닫기":"정답·해설 보기";
    }
    renderExamMeta();
  }else{
    el("examReviewActions").classList.add("hidden");
    el("studyActions").classList.remove("hidden");
    renderBankResult(q,st);
    el("explainBtn").textContent=showExp?"해설 닫기":"정답·해설 보기";
  }
  el("prevBtn").disabled=currentIndex===0;el("nextBtn").disabled=currentIndex===currentList.length-1;
  renderGrid();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderExamMeta(){
  var st=sessionState(currentSession),count=answeredCount(),lat=latestAttempt(currentSession);
  el("heroTitle").textContent=currentSession+"회차 모의고사";
  el("answeredChip").textContent=count+" / 25 응답";
  el("attemptChip").textContent=st.attempts.length?("응시 "+st.attempts.length+"회"): "첫 응시";
  el("submitStatus").textContent=count+" / 25문항 응답";
  el("submitExamBtn").textContent=currentSession+"회차 제출·채점";
  var comp=sessionComposition(currentSession),box=el("composition");box.innerHTML="";
  Object.keys(comp).forEach(function(k){var s=document.createElement("span");s.textContent=k+" "+comp[k]+"문항";box.appendChild(s)});
  if(st.submitted&&lat){
    el("scoreCircle").textContent=lat.score;
    el("scoreTitle").textContent=currentSession+"회차 "+lat.score+"점";
    el("scoreDetail").textContent="정답 "+lat.correct+"문항 · 오답 "+lat.wrong+"문항 · 미응답 "+lat.blank+"문항 · 최고 "+bestAttempt(currentSession).score+"점";
  }
}
function selectChoice(n){
  var q=currentList[currentIndex],mode=currentMode();
  if(mode==="exam"){
    var st=sessionState(currentSession);if(st.submitted)return;st.answers[q.id]=n;saveExam();render();
  }else{
    bankRecord(q.id,{choice:n,seen:true});render();
  }
}
function bankRecord(id,patch){bankState[id]=Object.assign({},bankState[id]||{},patch);saveBank()}
function renderBankResult(q,st){
  var box=el("resultBox");box.className="result-box hidden";
  if(st.result==="correct"){box.className="result-box ok";box.textContent="정답입니다."}
  else if(st.result==="wrong"){box.className="result-box wrong";box.textContent=q.answerKey?("오답입니다. 정답은 "+circ[q.answerKey]+"입니다."):"오답으로 기록했습니다."}
  else if(st.result==="self"){box.className="result-box info";box.textContent="서술형 답안을 작성했습니다. 해설과 비교해 확인하세요."}
}
function renderGrid(){
  var g=el("numberGrid");g.innerHTML="";
  var mode=currentMode();
  currentList.forEach(function(q,i){
    var b=document.createElement("button");b.textContent=mode==="exam"?(i+1):q.num;
    if(mode==="exam"){
      var st=sessionState(currentSession),ans=st.answers[q.id];
      if(ans)b.classList.add("answered");
      if(st.submitted&&ans===q.answerKey)b.classList.add("correct");
      if(st.submitted&&ans!==q.answerKey)b.classList.add("wrong");
    }else{
      var s=bankState[q.id]||{};if(s.seen)b.classList.add("answered");if(s.result==="wrong")b.classList.add("wrong");if(s.result==="correct")b.classList.add("correct");
    }
    if(i===currentIndex)b.classList.add("current");
    b.onclick=function(){currentIndex=i;render()};g.appendChild(b);
  });
}
function submitExam(){
  var st=sessionState(currentSession);if(st.submitted)return;
  var qs=sessionQuestions(currentSession),blank=0,correct=0;
  qs.forEach(function(q){var a=st.answers[q.id];if(!a)blank++;else if(a===q.answerKey)correct++});
  if(blank&&!confirm("미응답 "+blank+"문항이 있습니다. 미응답은 오답 처리됩니다. 그대로 제출할까요?"))return;
  var score=correct*4,wrong=PER_SESSION-correct-blank;
  var attempt={at:new Date().toISOString(),score:score,correct:correct,wrong:wrong,blank:blank};
  st.submitted=true;st.attempts.push(attempt);st.explain={};saveExam();render();toast(currentSession+"회차 "+score+"점");
}
function retrySession(){
  var st=sessionState(currentSession);st.answers={};st.submitted=false;st.explain={};currentIndex=0;saveExam();applyMode();toast("새 응시를 시작합니다.")
}
function reviewWrong(){
  var st=sessionState(currentSession),qs=sessionQuestions(currentSession);
  var idx=qs.findIndex(function(q){return st.answers[q.id]!==q.answerKey});
  if(idx<0){toast("오답이 없습니다.");return}currentIndex=idx;render();
}
function toggleExamExplain(){
  var q=currentList[currentIndex],st=sessionState(currentSession);st.explain[q.id]=!st.explain[q.id];saveExam();render()
}
function checkBank(){
  var q=currentList[currentIndex],s=bankState[q.id]||{};
  if(q.type==="mc"){
    if(!s.choice){toast("먼저 답을 선택하세요.");return}
    bankRecord(q.id,{result:s.choice===q.answerKey?"correct":"wrong",seen:true,explain:true});render()
  }else{
    if(!(s.text||"").trim()){toast("답안을 먼저 작성하세요.");return}
    bankRecord(q.id,{result:"self",seen:true,explain:true});render()
  }
}
function toggleBankExplain(){
  var q=currentList[currentIndex],s=bankState[q.id]||{};bankRecord(q.id,{explain:!s.explain,seen:true});render()
}
function toggleBookmark(){
  var q=currentList[currentIndex],mode=currentMode();
  if(mode==="exam"){var st=sessionState(currentSession);if(!st.bookmarks)st.bookmarks={};st.bookmarks[q.id]=!st.bookmarks[q.id];saveExam()}
  else{var s=bankState[q.id]||{};bankRecord(q.id,{bookmark:!s.bookmark})}
  render()
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}

el("viewMode").onchange=function(){currentIndex=0;applyMode()};
el("sectionFilter").onchange=function(){currentIndex=0;applyMode()};
el("bankFilter").onchange=function(){currentIndex=0;applyMode()};
el("randomBtn").onclick=function(){currentIndex=Math.floor(Math.random()*currentList.length);render()};
el("gridBtn").onclick=function(){el("numberGrid").classList.toggle("hidden")};
el("prevBtn").onclick=function(){if(currentIndex>0){currentIndex--;render()}};
el("nextBtn").onclick=function(){if(currentIndex<currentList.length-1){currentIndex++;render()}};
el("submitExamBtn").onclick=submitExam;
el("retryBtn").onclick=retrySession;
el("reviewWrongBtn").onclick=reviewWrong;
el("examExplainBtn").onclick=toggleExamExplain;
el("checkBtn").onclick=checkBank;
el("explainBtn").onclick=toggleBankExplain;
el("bookmarkBtn").onclick=toggleBookmark;
el("resetAllBtn").onclick=function(){
  if(confirm("회차별 성적과 문제풀이 기록을 모두 초기화할까요?")){
    examState={sessions:{}};bankState={};localStorage.removeItem(EXAM_KEY);localStorage.removeItem(BANK_KEY);currentSession=1;currentIndex=0;refreshScores();applyMode();toast("전체 기록을 초기화했습니다.")
  }
};

var sf=el("sectionFilter");SECTIONS.forEach(function(s){var o=document.createElement("option");o.value=s;o.textContent=s;sf.appendChild(o)});
refreshScores();applyMode();
})();
</script>
</body>
</html>
