<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18324f">
<title>경기외고 문법 시험 대비</title>
<style>
:root{
  --navy:#173a63;--navy2:#102c4b;--blue:#28679d;--sky:#edf5fb;
  --ink:#172033;--muted:#667085;--line:#d9e2ec;--bg:#f4f7fa;
  --ok:#18794e;--okbg:#eaf8f0;--bad:#b42318;--badbg:#fff1ef;
  --paper:#fff;--gold:#8a6412;--goldbg:#fff8dd
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.72}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:28px 20px}
.top h1{max-width:1180px;margin:0 auto;font-size:clamp(28px,4vw,42px);line-height:1.18;letter-spacing:-.03em}
.mainnav{position:sticky;top:0;z-index:30;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navinner{max-width:1180px;margin:auto;padding:10px 18px;display:flex;gap:8px;overflow:auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-weight:850;white-space:nowrap;color:#344054}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.shell{max-width:1180px;margin:auto;padding:20px 18px 70px}
.panel{display:none}.panel.active{display:block}
.topicbar{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}
.topicbtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;font-size:14px;font-weight:800;white-space:nowrap}
.topicbtn.active{background:var(--sky);border-color:#8eb2d3;color:var(--navy)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #1720330c}
.concept{padding:24px 26px;margin-bottom:16px}
.concept h2{margin:0 0 16px;font-size:25px;color:var(--navy)}
.concept h3{margin:18px 0 8px;font-size:17px}
.concept p{margin:8px 0}
.concept ul{margin:8px 0 8px 22px;padding:0}
.concept li{margin:5px 0}
.rule{background:#f7f9fc;border-left:5px solid #7d9fbe;border-radius:10px;padding:13px 15px;margin:13px 0;white-space:pre-line}
.examples{background:#fbfcfe;border:1px solid #e4e9ef;border-radius:12px;padding:12px 14px;margin-top:10px}
.casehead,.mockhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:#f9fbfd}
.casebody{padding:22px 24px}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--sky);color:var(--navy);font-size:12px;font-weight:900;padding:6px 10px}
.counter{font-size:13px;color:var(--muted);font-weight:800}
.prompt{font-size:21px;font-weight:900;line-height:1.55;margin:2px 0 17px;white-space:pre-line}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:1px solid #cfd9e3;background:#fff;border-radius:13px;padding:13px 15px;color:var(--ink)}
.option:hover{border-color:#6f9dc5;background:#f8fbfe}
.option.selected{border:2px solid var(--blue);background:#eef6fc}
.option.correct{border:2px solid var(--ok);background:var(--okbg)}
.option.wrong{border:2px solid var(--bad);background:var(--badbg)}
.feedback{display:none;margin-top:15px;padding:14px 15px;border-radius:11px;background:#f7f9fc;border-left:5px solid var(--navy)}
.feedback.show{display:block}
.feedback strong{color:var(--navy)}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:17px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:850;color:#344054}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--goldbg);border-color:#dec778;color:var(--gold)}
.two{display:grid;grid-template-columns:270px 1fr;gap:15px}
.mocklist{padding:12px;align-self:start;position:sticky;top:68px}
.group{font-size:12px;font-weight:900;color:var(--muted);padding:9px 8px 5px}
.mockbtn{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:750;color:#344054}
.mockbtn:hover{background:#f2f5f8}
.mockbtn.active{background:var(--sky);color:var(--navy)}
.mockcontent{overflow:hidden}
.mockbody{padding:22px 24px}
.passage,.boxview{white-space:pre-wrap;font-family:"Noto Serif KR","Batang","바탕",serif;font-size:15.5px;line-height:1.85}
.passage{background:#fbfcfd;border:1px solid #dfe6ed;border-radius:12px;padding:18px;margin-bottom:14px}
.boxview{background:#f7f9fc;border:1px solid #ccd8e4;border-radius:12px;padding:16px;margin:12px 0 17px}
.qprompt{font-size:20px;font-weight:900;margin:17px 0 12px}
.choicecheck{border:1px solid var(--line);border-radius:13px;background:#fff;margin:9px 0;overflow:hidden}
.choice-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px}
.choice-text{font-size:15.5px;line-height:1.65}
.reveal{border:1px solid #9db7ce;background:#fff;border-radius:9px;padding:8px 10px;font-weight:850;color:var(--navy);white-space:nowrap}
.analysis{display:none;border-top:1px solid var(--line);padding:13px 14px;background:#f9fbfd}
.analysis.show{display:block}
.analysis .mark{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;font-weight:950;margin-right:7px}
.mark.o{background:var(--okbg);color:var(--ok)}
.mark.x{background:var(--badbg);color:var(--bad)}
.finalanswer{display:none;margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--goldbg);border:1px solid #e1cd83;font-weight:900;color:#6d4d0d}
.finalanswer.show{display:block}
.source{font-size:12px;color:var(--muted);margin-top:9px}
@media(max-width:850px){
  .two{grid-template-columns:1fr}
  .mocklist{position:static}
  .concept,.casebody,.mockbody{padding:18px}
  .choice-line{grid-template-columns:1fr}
  .reveal{justify-self:start}
}
@media print{
  .mainnav,.topicbar,.actions,.mocklist,.reveal{display:none!important}
  body{background:#fff}.shell{max-width:none;padding:0}.card{box-shadow:none}
  .panel{display:block!important}.analysis{display:block}.finalanswer{display:block}
}
</style>
</head>
<body>
<header class="top"><h1>경기외고 문법 시험 대비</h1></header>

<nav class="mainnav">
  <div class="navinner">
    <button class="tab active" data-view="conceptPanel">개념 학습</button>
    <button class="tab" data-view="mockPanel">모고 문제 점검</button>
  </div>
</nav>

<main class="shell">
  <section id="conceptPanel" class="panel active">
    <div id="topicbar" class="topicbar"></div>
    <article id="conceptCard" class="card concept"></article>
    <article id="caseCard" class="card"></article>
  </section>

  <section id="mockPanel" class="panel">
    <div class="two">
      <aside id="mockList" class="card mocklist"></aside>
      <article id="mockContent" class="card mockcontent"></article>
    </div>
  </section>
</main>

<script src="questions.js"></script>
<script src="mock-data.js"></script>
<script>

const ALL_Q = buildQuestions().filter(q=>CORE_CASE_IDS.has(q.id));

const CONCEPTS = {
  "음운 체계":{
    title:"1. 표준 발음과 음운 체계",
    html:`<p><b>음운</b>은 말의 뜻을 구별해 주는 최소의 소리 단위이다. 학습지에서는 음운을 글자가 아니라 <b>소리</b>로 파악하도록 한다.</p>
    <h3>분절 음운</h3>
    <div class="rule">자음: 발음 기관의 방해가 있음 / 홀로 음절을 이루지 못함
단모음: 발음 기관의 방해가 없음 / 홀로 음절을 이룸
반모음: 발음 기관의 방해가 없음 / 홀로 음절을 이루지 못함
j = 반모음 ㅣ / w = 반모음 ㅗ·ㅜ</div>
    <p>이중 모음은 반모음과 단모음의 결합으로 이루어지고, 학습지에서는 총 11개를 제시한다. ㅑ·ㅕ·ㅛ·ㅠ·ㅒ·ㅖ는 ‘ㅣ’ 상향 모음, ㅢ는 ‘ㅣ’ 하향 모음, ㅘ·ㅝ·ㅙ·ㅞ는 ‘ㅜ’ 상향 모음으로 정리한다.</p>
    <h3>비분절 음운</h3>
    <p>소리의 길이·높낮이·강세 등이 해당한다. 국어에서는 장단이 제한적으로 의미를 변별하며, 장음은 단어 첫머리에 올 수 있다. 학습지의 예는 눈ː(雪)/눈(目), 말ː(言)/말(馬), 밤ː(栗)/밤(夜)이다.</p>
    <h3>자음·단모음 체계</h3>
    <div class="examples"><b>자음 19개</b> — 파열음, 파찰음, 마찰음, 비음, 유음 / 예사소리·된소리·거센소리의 구별<br><b>단모음 10개</b> — 혀의 높이, 혀의 앞뒤 위치, 입술 모양으로 분류</div>`
  },
  "표준 발음":{
    title:"2. 표준 발음법의 기본 원칙",
    html:`<p>표준 발음법은 <b>표준어의 실제 발음</b>을 따르되, <b>국어의 전통성과 합리성</b>을 함께 고려하여 정한다.</p>
    <div class="rule">실제 발음: 현대 서울말의 현실 발음을 바탕으로 함
전통성: 오래된 발음상의 관습을 고려함
합리성: 국어의 음운 체계와 발음 규칙에 맞는지를 고려함</div>
    <p>겹받침의 발음에서 단어마다 탈락되는 자음이 다른 점, ㅚ·ㅟ나 ㅢ에서 복수 표준 발음을 허용하는 점은 현실 발음을 고려한 결과이다. 반면 모든 현실 발음이 표준이 되는 것은 아니다.</p>
    <p>‘맛있다, 멋있다’는 원칙 발음 [마딛따], [머딛따]를 두면서 실제 사용 빈도가 높은 [마싣따], [머싣따]도 허용한다.</p>
    <p>연음은 소리 자체가 바뀌지 않고 위치가 옮겨지는 경우이므로 그 자체만으로는 음운 변동에 해당하지 않는다.</p>`
  },
  "교체·동화":{
    title:"3. 음운의 교체와 동화",
    html:`<p>학습지에서 교체의 주요 유형은 <b>음절의 끝소리 규칙, 비음화, 유음화, 구개음화, 된소리되기</b>이다.</p>
    <h3>비음화</h3>
    <div class="rule">ㄱ·ㄷ·ㅂ + ㄴ·ㅁ → ㅇ·ㄴ·ㅁ + ㄴ·ㅁ
ㅁ·ㅇ + ㄹ → ㅁ·ㅇ + ㄴ
ㄱ·ㄷ·ㅂ + ㄹ → ㅇ·ㄴ·ㅁ + ㄴ</div>
    <p>대표 사례: 국물[궁물], 닫는[단는], 담력[담녁], 종로[종노], 협력[혐녁]</p>
    <h3>유음화</h3>
    <p>ㄹ+ㄴ → ㄹ+ㄹ, ㄴ+ㄹ → ㄹ+ㄹ. 대표 사례는 칼날[칼랄], 신라[실라], 난로[날로]이다.</p>
    <h3>구개음화</h3>
    <p>ㄷ·ㅌ이 뒤의 ㅣ의 영향으로 ㅈ·ㅊ으로 변한다. 굳이[구지], 같이[가치]가 대표적이다. ‘닫히다’는 축약 후 구개음화로 설명한다.</p>
    <h3>된소리되기</h3>
    <p>받침 ㄱ·ㄷ·ㅂ 뒤 예사소리, 특정 용언 어간 받침 뒤 어미의 첫소리, 한자어 ㄹ 받침 뒤 ㄷ·ㅅ·ㅈ 등 여러 환경을 구별해야 한다.</p>`
  },
  "탈락·축약":{
    title:"4. 자음군 단순화·탈락·축약",
    html:`<h3>겹받침</h3>
    <div class="rule">제10항: ㄳ·ㄵ·ㄼ/ㄽ/ㄾ·ㅄ → [ㄱ]·[ㄴ]·[ㄹ]·[ㅂ]
제11항: ㄺ·ㄻ·ㄿ → [ㄱ]·[ㅁ]·[ㅂ]</div>
    <p>예외가 중요하다. ‘밟-’은 자음 앞에서 [밥]으로, ‘넓-’은 넓죽하다/넓둥글다에서 [넙]으로 발음한다. 용언 어간 말음 ㄺ은 ㄱ 앞에서 [ㄹ]로 발음한다.</p>
    <h3>탈락</h3>
    <p>ㄹ 탈락은 ㄴ·ㅂ·ㅅ 등으로 시작하는 어미 앞에서 나타나며 표기에 반영된다. ㅎ 탈락은 모음으로 시작하는 형식 형태소 앞에서 나타난다. ㅡ 탈락과 ㅏ/ㅓ 탈락도 표기에 반영된다.</p>
    <h3>축약</h3>
    <div class="rule">ㅎ(ㄶ, ㅀ) + ㄱ·ㄷ·ㅈ → ㅋ·ㅌ·ㅊ
ㄱ(ㄺ)·ㄷ·ㅂ(ㄼ)·ㅈ(ㄵ) + ㅎ → ㅋ·ㅌ·ㅍ·ㅊ</div>
    <p>놓고[노코], 좋던[조ː턴], 좁히다[조피다], 꽂히다[꼬치다] 등의 실제 발음까지 함께 확인한다.</p>`
  },
  "첨가":{
    title:"5. ㄴ 첨가와 반모음 첨가",
    html:`<h3>ㄴ 첨가</h3>
    <p>합성어·파생어에서 앞말이 자음으로 끝나고 뒤말의 첫음절이 이·야·여·요·유이면 ㄴ이 첨가되어 [니·냐·녀·뇨·뉴]로 발음된다.</p>
    <div class="examples">솜이불[솜니불], 꽃잎[꼰닙], 색연필[생년필], 식용유[시굥뉴], 한여름[한녀름]</div>
    <p>ㄹ 받침 뒤에 첨가되는 ㄴ은 [ㄹ]로 발음한다. 들일[들릴], 물약[물략], 서울역[서울력], 휘발유[휘발류]가 대표적이다.</p>
    <h3>반모음 첨가</h3>
    <p>용언 뒤에 어미가 결합할 때 j 첨가는 표준 발음으로 인정하지만 w 첨가는 인정하지 않는다. 피어[피어/피여], 되어[되어/되여]는 가능하지만 *[보와라]는 인정하지 않는다. 반모음 첨가 결과는 표기에 반영하지 않는다.</p>`
  },
  "사잇소리":{
    title:"6. 사잇소리 현상과 사이시옷",
    html:`<p>사잇소리는 조건이 복잡하고 수의적인 경우가 있어 <b>표준 발음과 의미 관계</b>를 함께 보아야 한다.</p>
    <div class="rule">고유어가 포함된 합성어
① 앞 울림소리 + 뒤 안울림 예사소리 → 뒷말 된소리
② 앞 모음 + 뒤 ㄴ·ㅁ → ㄴ 소리 덧남
③ 뒤 ㅣ/j 계열 → ㄴ 또는 ㄴㄴ 소리 덧남

한자어끼리의 합성어는 사이시옷을 원칙적으로 적지 않음
예외 6개: 곳간, 셋방, 찻간, 툇간, 숫자, 횟수</div>
    <p>사이시옷과 경음화는 합성어의 의미 관계도 중요하다. 학습지에서는 시간(그믐달), 장소(길가), 용도(술잔), 기원/소유(강줄기)의 관계를 제시한다.</p>
    <p>반대로 재료 관계의 쌀밥·콩밥, 대상 관계의 소고기·불고기, 병렬 관계의 논밭 등은 구별해야 한다.</p>`
  },
  "형태소·단어":{
    title:"7. 형태소와 단어",
    html:`<div class="rule">음운 < 형태소 < 단어 < 문장 < 담화</div>
    <p><b>형태소</b>는 뜻을 가진 가장 작은 말의 단위이다.</p>
    <h3>자립성에 따른 분류</h3>
    <p>자립 형태소: 명사·대명사·수사·관형사·부사·감탄사<br>의존 형태소: 용언/서술격 조사의 어간, 조사, 어미, 접사</p>
    <h3>실질적 의미에 따른 분류</h3>
    <p>실질 형태소: 자립 형태소 6종류와 단일어 용언의 어간<br>형식 형태소: 조사·어미·접사</p>
    <p>‘새해’의 ‘새’는 관형사이므로 합성어, ‘새까맣다’의 ‘새-’는 접두사이므로 파생어이다. ‘한여름’의 ‘한-’도 접두사로 분석한다.</p>
    <p>조사는 자립할 수 없지만 단어로 인정되는 예외라는 점도 함께 확인한다.</p>`
  },
  "어미·접사":{
    title:"8. 어미·이형태·접사",
    html:`<h3>어간·어미 / 어근·접사</h3>
    <p>어간은 활용할 때 고정되는 부분, 어미는 활용할 때 교체되는 부분이다. 어근은 단어의 실질적 의미 중심이며, 접사는 어근에 붙어 새말을 만든다.</p>
    <h3>어미 체계</h3>
    <p>선어말 어미는 높임·시제·공손으로 나누고, 학습지에서는 <b>높임 → 시제 → 공손</b>의 순서를 제시한다. 종결 어미, 연결 어미, 전성 어미의 하위 유형도 구별한다.</p>
    <h3>이형태</h3>
    <p>하나의 형태소가 앞뒤 환경에 따라 둘 이상의 모습으로 나타나는 각각의 형식이다. 이/가, 을/를, -았-/-었- 등이 대표 사례이다.</p>
    <h3>명사형과 파생 명사</h3>
    <p>서술성이 남아 있으면 용언의 명사형, 서술성이 없으면 파생 명사 쪽으로 본다. 관형어의 수식을 받으면 체언, 부사어의 수식을 받으면 용언의 명사형이라는 실전 기준도 제시되어 있다.</p>
    <h3>접사</h3>
    <p>접두사는 주로 의미를 제한하고, 접미사는 의미 제한뿐 아니라 품사 변경과 문장 구조 변화에도 관여한다.</p>`
  },
  "문장·모고":{
    title:"9. 문장의 짜임·본용언·병렬 구성",
    html:`<p>홑문장은 주어와 서술어 관계가 한 번, 겹문장은 두 번 이상 나타난다. 겹문장은 안은문장과 이어진문장으로 나뉜다.</p>
    <div class="rule">안긴문장: 명사절 · 부사절 · 인용절 · 서술절 · 관형사절</div>
    <p>관형사절에서는 수식을 받는 명사와 안긴문장 속 성분이 동일하여 성분이 생략되는 경우가 중요하다.</p>
    <h3>본용언·보조 용언</h3>
    <p>본용언은 주된 서술을 담당하고, 보조 용언은 앞의 본용언 의미를 보충한다. 동사는 현재 시제 ‘-는/-ㄴ-’이나 ‘-고 있다’와의 결합 가능성을 품사 판별에 활용할 수 있다.</p>
    <h3>병렬 구성</h3>
    <p>① 연결되는 요소의 단위가 맞는가, ② 생략된 성분이 앞 절의 동일한 문장 성분과 대응하는가, ③ 대등하게 연결된 모든 요소가 같은 서술어와 호응하는가를 점검한다.</p>`
  },
  "활용·모고":{
    title:"10. 용언 활용과 표기·관형사절",
    html:`<p>용언의 활용형은 원칙적으로 어간과 어미의 원래 형태를 밝혀 적지만, 활용 중 일어난 음운 변동의 결과가 표기에 반영되기도 하고 반영되지 않기도 한다.</p>
    <div class="rule">나오+아 → 나와 : 오 → 반모음 w 교체
견디+어 → 견뎌 : 이 → 반모음 j 교체
견디+어 → [견디여] : j 첨가
사+아 → 사 : 동일 모음 탈락
쓰+어 → 써 : ㅡ 탈락</div>
    <p>르 불규칙과 러 불규칙도 구별한다. 지르다→질러, (정상에) 이르다→이르러의 변화가 대표적이다.</p>
    <h3>관형사절</h3>
    <p>수식받는 명사가 관형사절 내부의 문장 성분으로 복원되면 관계 관형사절, 절 전체가 수식받는 명사의 내용이 되면 내용 관형사절로 판단한다.</p>`
  },
  "국어사":{
    title:"11. 중세 국어 목적격 조사",
    html:`<p>중세 국어 목적격 조사는 현대의 ‘을/를’ 외에 ‘/’이 있었다.</p>
    <div class="rule">받침 있음 →  / 을
받침 없음 →  / 를
양성 모음 →  / 
음성 모음 → 을 / 를</div>
    <p>끝음절 모음이 중성 모음 ㅣ인 체언은 모음 조화와 무관하게 받침 유무를 중심으로 조사 형태가 결정되며 두 계열 모두 가능하다. ㅔ·ㅟ도 이와 같은 방식으로 설명한다.</p>
    <p>검증본 원문 기준 분류: ‘’ 바·아바님 / ‘’ 둡게·벼로 / ‘을’ 아바님· / ‘를’ 둡게·염규.</p>`
  },
  "실전 고난도":{
    title:"12. 실전 고난도 종합",
    html:`<p>이 단계에서는 한 사례에 음운 변동이 두 가지 이상 연속해서 적용되는지, 표기와 발음이 어떻게 달라지는지, 형태소·접사의 기능이 문장 구조까지 바꾸는지 등을 함께 판단한다.</p>
    <p>특히 <b>발음 규정 → 실제 사례 → 형태소 분석 → 문장 구조</b>를 연결해서 설명할 수 있는지를 확인한다.</p>
    <div class="examples">좋은[조은] / 놓고[노코] / 꽃잎[꼰닙] / 김밥[김빱] / 새해·새까맣다 / 박물관에서 일어난 사건 / 전쟁이 끝날 가능성 등의 사례를 종합적으로 점검한다.</div>`
  }
};

let currentTopic=Object.keys(CONCEPTS)[0];
let caseIndex=0;
let selectedCase=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===btn));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===btn.dataset.view));
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

function renderTopicBar(){
  const bar=document.getElementById("topicbar");
  bar.innerHTML=Object.keys(CONCEPTS).map(k=>`<button class="topicbtn ${k===currentTopic?"active":""}" data-topic="${esc(k)}">${esc(k)}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    currentTopic=b.dataset.topic;caseIndex=0;selectedCase=null;
    renderTopicBar();renderConcept();renderCase();
  });
}
function renderConcept(){
  const d=CONCEPTS[currentTopic];
  document.getElementById("conceptCard").innerHTML=`<h2>${esc(d.title)}</h2>${d.html}`;
}
function topicQuestions(){
  return ALL_Q.filter(q=>q.cat===currentTopic);
}
function renderCase(){
  const list=topicQuestions();
  if(!list.length){
    document.getElementById("caseCard").innerHTML='<div class="casebody">사례 문제가 없습니다.</div>';return;
  }
  if(caseIndex<0)caseIndex=0;if(caseIndex>=list.length)caseIndex=list.length-1;
  const q=list[caseIndex];selectedCase=null;
  const card=document.getElementById("caseCard");
  card.innerHTML=`<div class="casehead"><span class="badge">사례 점검</span><span class="counter">${caseIndex+1} / ${list.length}</span></div>
  <div class="casebody">
    <div class="prompt">${esc(q.prompt)}</div>
    <div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${i+1}.</b> ${esc(o)}</button>`).join("")}</div>
    <div id="caseFeedback" class="feedback"></div>
    <div class="actions">
      <div><button class="btn" id="casePrev">← 이전 사례</button> <button class="btn" id="caseNext">다음 사례 →</button></div>
      <button class="btn gold" id="caseReveal">정답·해설 보기</button>
    </div>
  </div>`;
  card.querySelectorAll(".option").forEach(el=>el.onclick=()=>{
    card.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
    el.classList.add("selected");selectedCase=Number(el.dataset.i);
  });
  document.getElementById("caseReveal").onclick=()=>{
    card.querySelectorAll(".option").forEach((el,i)=>{
      el.classList.remove("correct","wrong");
      if(i===q.answer)el.classList.add("correct");
      if(selectedCase!==null && i===selectedCase && i!==q.answer)el.classList.add("wrong");
    });
    const fb=document.getElementById("caseFeedback");
    fb.className="feedback show";
    fb.innerHTML=`<strong>정답 ${q.answer+1}번</strong><br>${esc(q.exp)}`;
  };
  document.getElementById("casePrev").onclick=()=>{caseIndex=Math.max(0,caseIndex-1);renderCase();};
  document.getElementById("caseNext").onclick=()=>{caseIndex=Math.min(list.length-1,caseIndex+1);renderCase();};
}

let activeMock=MOCK_SETS[0]?.id;
function groupedMocks(){
  const groups=[];
  for(const m of MOCK_SETS){
    let g=groups.find(x=>x.name===m.group);
    if(!g){g={name:m.group,items:[]};groups.push(g);}
    g.items.push(m);
  }
  return groups;
}
function renderMockList(){
  const el=document.getElementById("mockList");
  el.innerHTML=groupedMocks().map(g=>`<div class="group">${esc(g.name)}</div>${g.items.map(m=>`<button class="mockbtn ${m.id===activeMock?"active":""}" data-id="${esc(m.id)}">${esc(m.title)}</button>`).join("")}`).join("");
  el.querySelectorAll(".mockbtn").forEach(b=>b.onclick=()=>{
    activeMock=b.dataset.id;renderMockList();renderMock();
    document.getElementById("mockContent").scrollIntoView({behavior:"smooth",block:"start"});
  });
}
function renderMock(){
  const m=MOCK_SETS.find(x=>x.id===activeMock)||MOCK_SETS[0];
  const el=document.getElementById("mockContent");
  el.innerHTML=`<div class="mockhead"><span class="badge">${esc(m.group)}</span><span class="counter">${esc(m.title)}</span></div>
  <div class="mockbody">
    <div class="passage">${esc(m.passage)}</div>
    ${m.box?`<div class="boxview">${esc(m.box)}</div>`:""}
    <div class="qprompt">${esc(m.prompt)}</div>
    <div>${m.options.map((o,i)=>`<div class="choicecheck">
      <div class="choice-line"><div class="choice-text"><b>${i+1}.</b> ${esc(o)}</div><button class="reveal" data-i="${i}">선택지 점검</button></div>
      <div class="analysis" id="analysis-${i}"><span class="mark ${m.verdicts[i]==="O"?"o":"x"}">${m.verdicts[i]}</span>${esc(m.analyses[i])}</div>
    </div>`).join("")}</div>
    <div class="actions"><button class="btn gold" id="showFinal">정답 보기</button><button class="btn" id="showAll">선택지 전체 점검</button></div>
    <div id="finalAnswer" class="finalanswer">정답: ${m.answer+1}번</div>
    <div class="source">${esc(m.source)}</div>
  </div>`;
  el.querySelectorAll(".reveal").forEach(btn=>btn.onclick=()=>{
    document.getElementById("analysis-"+btn.dataset.i).classList.toggle("show");
  });
  document.getElementById("showFinal").onclick=()=>document.getElementById("finalAnswer").classList.toggle("show");
  document.getElementById("showAll").onclick=()=>{
    const boxes=[...el.querySelectorAll(".analysis")];
    const allOpen=boxes.every(x=>x.classList.contains("show"));
    boxes.forEach(x=>x.classList.toggle("show",!allOpen));
  };
}

renderTopicBar();renderConcept();renderCase();renderMockList();renderMock();
</script>
