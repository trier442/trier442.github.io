<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173a63">
<title>경기외고 화법과 언어 직전보충</title>
<style>
:root{
  --navy:#173a63;--blue:#245b91;--sky:#eaf3fb;--ink:#172033;--muted:#667085;
  --line:#d8e1ea;--ok:#16794b;--okbg:#e9f8f0;--bad:#b42318;--badbg:#fff0ee;
  --warn:#9a6700;--warnbg:#fff8db;--card:#fff;--bg:#f3f6f9
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:auto;padding:0 18px}
.top{background:linear-gradient(135deg,#102c4b,#245b91);color:#fff;padding:30px 0 24px;box-shadow:0 4px 18px #102c4b33}
.top h1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:0 0 8px}
.top p{margin:0;color:#dbe9f6}
.source-note{margin-top:15px;padding:11px 13px;border:1px solid #ffffff38;border-radius:12px;background:#ffffff12;font-size:13px}
.toolbar{position:sticky;top:0;z-index:20;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px;overflow:auto}
.pill{border:1px solid var(--line);background:#fff;color:#344054;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:700;font-size:14px}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
main{padding:20px 0 60px}
.dashboard{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;margin-bottom:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 10px #1d29390b}
.box strong{display:block;font-size:24px;color:var(--navy)}
.box span{font-size:12px;color:var(--muted)}
.namebox label{display:block;font-weight:800;margin-bottom:7px}
.namebox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdff}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.action{border:none;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--navy);color:#fff}
.action.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.action.muted{background:#eef2f6;color:#344054}
.action.danger{background:#fff;color:var(--bad);border:1px solid #f0b4ae}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.section-title h2{font-size:18px;margin:0}
#questionCard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 25px #1d293914;overflow:hidden}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;background:#f8fbfd;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--sky);color:var(--blue);padding:6px 10px;font-size:12px;font-weight:800}
.source{font-size:12px;color:var(--muted);text-align:right}
.qbody{padding:22px}
.qnum{font-size:13px;color:var(--muted);font-weight:800}
.prompt{font-size:clamp(18px,2.5vw,23px);font-weight:850;line-height:1.55;margin:8px 0 18px;white-space:pre-line}
.context{background:#f7f9fc;border-left:4px solid #8aa9c7;border-radius:10px;padding:13px 14px;margin:0 0 17px;white-space:pre-line;font-size:14px}
.fillrow{display:flex;gap:8px;align-items:center}
.fillrow input{flex:1;min-width:0;border:2px solid #b8c8d8;border-radius:12px;padding:13px 14px;font-size:18px}
.hint{margin-top:8px;font-size:13px;color:var(--muted)}
.options{display:grid;gap:9px}
.option{width:100%;text-align:left;border:1px solid #cfd8e3;border-radius:12px;background:#fff;padding:12px 14px;color:var(--ink);transition:.15s}
.option:hover{border-color:#7096ba;background:#f7fbff}
.option.selected{border:2px solid var(--blue);background:#edf5fc}
.option.correct{border:2px solid var(--ok);background:var(--okbg)}
.option.wrong{border:2px solid var(--bad);background:var(--badbg)}
.feedback{display:none;margin-top:17px;padding:14px;border-radius:12px;border-left:5px solid}
.feedback.show{display:block}
.feedback.ok{background:var(--okbg);border-color:var(--ok)}
.feedback.bad{background:var(--badbg);border-color:var(--bad)}
.feedback .answer{font-weight:900;margin-bottom:4px}
.feedback .exp{font-size:14px}
.qfooter{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:#fbfcfd}
.qfooter .left,.qfooter .right{display:flex;gap:8px}
.small{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;color:#344054}
.small.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.small.unknown{color:var(--warn);border-color:#d9bd62;background:var(--warnbg)}
.progressline{height:8px;background:#e8edf2;border-radius:999px;overflow:hidden;margin-top:10px}
.progressline i{display:block;height:100%;background:linear-gradient(90deg,#245b91,#43a0d8);width:0}
.legend{font-size:12px;color:var(--muted);margin-top:7px}
.review{display:grid;gap:8px;margin-top:15px}
.review-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.review-item b{min-width:38px;color:var(--navy)}
.review-item span{font-size:13px;color:#475467}
.empty{padding:32px;text-align:center;color:var(--muted)}
.footer-note{margin-top:20px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:760px){
  .dashboard{grid-template-columns:1fr 1fr}.namebox{grid-column:1/-1}
  .qbody{padding:17px}.qhead{align-items:flex-start}.source{max-width:48%}
  .qfooter{align-items:center}.qfooter .left,.qfooter .right{gap:5px}
  .small{padding:8px 9px;font-size:13px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>경기외고 화법과 언어 직전보충</h1>
    <p>기숙사에서도 선생님과 한 문항씩 바로 확인하는 실시간 자가점검용</p>
    <div class="source-note">업로드된 <b>교사용 프린트2</b>, <b>인터넷 대조 전수 검증본</b>, <b>모의고사 원문 대조 수정본</b>의 범위와 용어를 기준으로 구성했습니다. 긴 기출 원문은 그대로 재배포하지 않고, 시험 직전 확인에 맞게 괄호형·객관식으로 재구성했습니다.</div>
  </div>
</header>

<nav class="toolbar"><div class="wrap" id="tabs"></div></nav>

<main class="wrap">
  <section class="dashboard">
    <div class="box namebox"><label for="studentName">학생 이름</label><input id="studentName" placeholder="이름 입력 (결과 복사에 포함)"></div>
    <div class="box"><strong id="attempted">0</strong><span>푼 문항</span></div>
    <div class="box"><strong id="correct">0</strong><span>정답</span></div>
    <div class="box"><strong id="wrong">0</strong><span>오답/모름</span></div>
    <div class="box"><strong id="accuracy">0%</strong><span>정답률</span></div>
  </section>

  <div class="controls">
    <button class="action" id="quickBtn">15문항 속성 보충</button>
    <button class="action secondary" id="copyBtn">결과 복사</button>
    <button class="action muted" id="shuffleBtn">현재 범위 섞기</button>
    <button class="action danger" id="resetBtn">전체 초기화</button>
  </div>

  <div class="box">
    <b id="modeTitle">전체</b>
    <div class="progressline"><i id="progressBar"></i></div>
    <div class="legend" id="progressText">0 / 0</div>
  </div>

  <div class="section-title"><h2>문항 풀이</h2><span class="badge" id="typeBadge">괄호형</span></div>
  <section id="questionCard"></section>

  <div class="section-title"><h2>오답 메모</h2><span class="badge" id="wrongCountBadge">0개</span></div>
  <div id="review" class="review"></div>
  <div class="footer-note">입력한 이름·풀이 기록은 이 기기의 브라우저에만 저장됩니다. 다른 기기와 자동 동기화되지는 않습니다.</div>
</main>

<script>
const Q = [
{id:1,cat:"음운 체계",type:"fill",prompt:"음운은 말의 뜻을 구별해 주는 최소의 (   ) 단위이다.",answers:["소리"],hint:"ㅅㄹ",exp:"학습지에서 음운은 글자가 아니라 소리라고 확인한다.",source:"교사용 프린트2 p.4"},
{id:2,cat:"음운 체계",type:"fill",prompt:"분절 음운의 세 종류는 자음, 모음, (   )이다.",answers:["반모음","반자음"],hint:"ㅂㅁㅇ",exp:"교사용 학습지에서는 자음·모음·반모음을 분절 음운으로 정리한다.",source:"교사용 프린트2 p.2"},

{id:4,cat:"음운 체계",type:"fill",prompt:"반모음 j는 반모음 (   )에 해당한다.",answers:["ㅣ","이"],hint:"한 글자",exp:"학습지에서는 j를 ‘반모음 ㅣ’로 설명한다.",source:"교사용 프린트2 p.2"},
{id:5,cat:"음운 체계",type:"fill",prompt:"반모음 w는 반모음 (   ) 계열에 해당한다.",answers:["ㅗㅜ","ㅗ·ㅜ","ㅗ/ㅜ","오우"],hint:"두 모음",exp:"w는 ㅗ·ㅜ 계열의 반모음으로 제시된다.",source:"교사용 프린트2 p.2"},
{id:6,cat:"음운 체계",type:"fill",prompt:"학습지 기준 이중 모음은 총 (   )개이다.",answers:["11","11개","열한개"],hint:"숫자",exp:"ㅑ·ㅕ·ㅛ·ㅠ·ㅒ·ㅖ, ㅢ, ㅘ·ㅝ·ㅙ·ㅞ의 11개를 제시한다.",source:"교사용 프린트2 p.2"},
{id:7,cat:"음운 체계",type:"fill",prompt:"학습지에서 하향 이중 모음으로 분류한 모음은 (   )이다.",answers:["ㅢ","의"],hint:"한 글자",exp:"학습지에서는 ㅢ를 ‘ㅣ 하향 모음’으로 분류한다.",source:"교사용 프린트2 p.2"},
{id:8,cat:"음운 체계",type:"mcq",prompt:"비분절 음운(운소)의 예로 가장 적절한 것은?",options:["자음의 조음 위치","소리의 길이","반모음 j","단모음 ㅏ"],answer:1,exp:"학습지는 소리의 길이·높낮이·강세 등을 비분절 음운의 예로 든다.",source:"교사용 프린트2 p.2"},

{id:11,cat:"음운 체계",type:"fill",prompt:"학습지의 단모음 체계표는 총 (   )개 단모음을 정리한다.",answers:["10","10개","열개"],hint:"숫자",exp:"고모음 4, 중모음 4, 저모음 2로 총 10개이다.",source:"교사용 프린트2 p.4"},

{id:15,cat:"음운 체계",type:"fill",prompt:"울림소리 중 비음은 ㅁ, ㄴ, (   )이다.",answers:["ㅇ"],hint:"한 글자",exp:"비음은 ㅁ·ㄴ·ㅇ, 유음은 ㄹ이다.",source:"교사용 프린트2 p.2"},

{id:16,cat:"음운 변동",type:"fill",prompt:"음운 변동의 네 유형은 교체, 탈락, 축약, (   )이다.",answers:["첨가"],hint:"ㅊㄱ",exp:"교체·탈락·축약·첨가의 네 유형으로 정리한다.",source:"교사용 프린트2 p.6"},
{id:17,cat:"음운 변동",type:"fill",prompt:"연음이 음운 변동이 아닌 이유는 음운 자체가 (   ) 않기 때문이다.",answers:["변하지","바뀌지"],hint:"ㅂㅎㅈ",exp:"자리가 옮겨질 뿐 교체·탈락·첨가·축약이 일어나지 않으면 음운 변동으로 보지 않는다.",source:"교사용 프린트2 p.6"},
{id:18,cat:"음운 변동",type:"fill",prompt:"음절의 끝소리 규칙에서 여러 받침은 대표음 [ㄱ], [ㄷ], (   ) 등으로 실현된다.",answers:["ㅂ"],hint:"한 글자",exp:"대표음화의 핵심 평파열음은 [ㄱ]·[ㄷ]·[ㅂ]이다.",source:"교사용 프린트2 p.6"},
{id:19,cat:"음운 변동",type:"mcq",prompt:"‘옷 안[오단]’의 발음 설명으로 가장 적절한 것은?",options:["받침 ㅅ이 그대로 연음된다.","받침 ㅅ이 대표음 [ㄷ]으로 바뀐 뒤 뒤 음절로 옮겨 간다.","ㄴ 첨가가 일어난다.","유음화가 일어난다."],answer:1,exp:"모음으로 시작하는 실질 형태소가 뒤따를 때 대표음으로 바꾼 뒤 연음한다.",source:"교사용 프린트2 p.6"},
{id:20,cat:"음운 변동",type:"fill",prompt:"받침 ㄱ·ㄷ·ㅂ 뒤의 ㄱ·ㄷ·ㅂ·ㅅ·ㅈ은 각각 (   )로 발음된다.",answers:["된소리","경음"],hint:"ㄷㅅㄹ",exp:"이 환경에서는 뒤의 예사소리가 된소리로 바뀐다.",source:"교사용 프린트2 p.6"},

{id:22,cat:"음운 변동",type:"fill",prompt:"비음화: 받침 ㄱ·ㄷ·ㅂ + ㄴ·ㅁ → 각각 (   )·ㄴ·ㅁ + ㄴ·ㅁ.",answers:["ㅇ"],hint:"한 글자",exp:"평파열음이 뒤 비음의 영향을 받아 같은 조음 위치의 비음으로 바뀐다.",source:"교사용 프린트2 p.7"},
{id:23,cat:"음운 변동",type:"fill",prompt:"비음화: 받침 ㅁ·ㅇ 뒤의 ㄹ은 (   )으로 바뀐다.",answers:["ㄴ"],hint:"한 글자",exp:"담력[담녁], 종로[종노]가 대표 예이다.",source:"교사용 프린트2 p.7"},
{id:24,cat:"음운 변동",type:"fill",prompt:"‘협력’의 표준 발음은 (   )이다.",answers:["혐녁","[혐녁]"],hint:"ㅎㅁㄴ",exp:"ㄱ 계열+ㄹ에서 양쪽이 비음으로 바뀌는 비음화가 나타난다.",source:"교사용 프린트2 p.7"},
{id:25,cat:"음운 변동",type:"fill",prompt:"‘칼날’의 표준 발음은 (   )이다.",answers:["칼랄","[칼랄]"],hint:"ㅋㄹㄹ",exp:"ㄹ+ㄴ → ㄹ+ㄹ의 유음화이다.",source:"교사용 프린트2 p.7"},

{id:69,cat:"모고 핵심",type:"mcq",prompt:"격 조사·보조사의 결합에 대한 설명으로 옳은 것은?",options:["보조사는 어미나 부사 뒤에는 절대 붙지 못한다.","격 조사와 보조사는 둘 이상 결합할 수 없다.","보조사는 일부 경우 어미나 부사 바로 뒤에도 결합할 수 있다.","격 조사끼리의 결합은 언제나 금지된다."],answer:2,exp:"학습 활동에서는 격 조사-격 조사, 격 조사-보조사, 보조사-격 조사, 보조사-보조사 유형과 보조사의 결합 범위를 다룬다.",source:"모의고사 원문 대조 수정본 p.3"},
{id:70,cat:"모고 핵심",type:"mcq",prompt:"단어 의미 변화의 유형 연결로 맞는 것은?",options:["확대-원래 의미 일부가 사라짐 / 축소-새 의미가 더해짐","확대-새 의미가 더해짐 / 축소-원래 의미 일부가 사라짐","이동-원래 의미가 그대로 유지됨","확대와 축소는 같은 현상"],answer:1,exp:"확대는 원래 의미가 유지되며 새 의미가 더해지고, 축소는 원래 의미의 일부가 사라진다. 이동은 원래 의미가 사라지고 새 의미가 생긴다.",source:"모의고사 원문 대조 수정본 p.3"},
{id:71,cat:"모고 핵심",type:"mcq",prompt:"학습지에서 제시한 의미 변화의 대응으로 맞는 것은?",options:["‘사이’-확대 / ‘놀다’-축소 / ‘즈음하다’-이동","‘사이’-축소 / ‘놀다’-확대 / ‘즈음하다’-이동","‘사이’-이동 / ‘놀다’-축소 / ‘즈음하다’-확대","세 단어 모두 확대"],answer:0,exp:"수업 자료는 ‘사이’ 확대, ‘놀다’ 축소, ‘즈음하다’ 이동으로 제시한다.",source:"모의고사 원문 대조 수정본 p.3"},
{id:72,cat:"모고 핵심",type:"mcq",prompt:"용언 활용과 표기의 관계에 대한 설명으로 가장 적절한 것은?",options:["모든 음운 변동은 반드시 표기에 반영된다.","어떤 음운 변동은 표기에 반영되고 어떤 것은 반영되지 않는다.","음운 변동은 표기와 전혀 관계없다.","불규칙 활용은 표기에 반영되지 않는다."],answer:1,exp:"쌓다의 여러 변동은 표기에 반영되지 않지만, 날다의 ㄹ 탈락 등은 표기에 반영되는 예가 있다.",source:"모의고사 원문 대조 수정본 p.4"},
{id:73,cat:"모고 핵심",type:"mcq",prompt:"‘본떠’와 ‘닳아서’를 대비한 설명으로 옳은 것은?",options:["둘 다 변동 결과가 표기에 반영되지 않는다.","‘본떠’의 변동은 표기에 반영되고 ‘닳아서’의 ㅎ 탈락은 표기에 반영되지 않는다.","‘본떠’에는 변동이 없다.","‘닳아서’만 표기에 반영된다."],answer:1,exp:"검증본에서는 ‘본떠’의 ㅡ 탈락 결과는 표기에 반영되고, ‘닳아서’의 ㅎ 탈락은 표기에 반영되지 않는다고 설명한다.",source:"인터넷 대조 검증본 / 6월 모평"},

{id:79,cat:"모고 핵심",type:"mcq",prompt:"동사와 형용사를 활용 양상으로 판별할 때 자료에서 강조한 기준은?",options:["동사는 현재 시제 -는/-ㄴ- 및 ‘-고 있다’와 결합 가능","형용사만 ‘-고 있다’와 결합 가능","둘 다 차이가 없다.","받침 유무만 본다."],answer:0,exp:"본용언·보조용언의 품사를 판별할 때 동사는 현재 시제 선어말 어미 및 ‘-고 있다’와의 결합 가능성을 본다고 제시한다.",source:"모의고사 원문 대조 수정본 p.1~2"},
{id:80,cat:"모고 핵심",type:"mcq",prompt:"자료에서 ‘못하다’에 대해 확인하는 핵심은?",options:["항상 본용언이다.","항상 보조 용언이다.","본용언과 보조 용언으로 모두 쓰일 수 있다.","항상 형용사이다."],answer:2,exp:"제시 자료는 ‘못하다’가 본용언과 보조 용언으로 모두 쓰일 수 있음을 탐구한다.",source:"모의고사 원문 대조 수정본 p.2"},
{id:81,cat:"모고 핵심",type:"mcq",prompt:"‘다음 장’과 ‘다음에는 저도 같이 갈게요’의 ‘다음’은 각각 무엇을 중심으로 가리키나?",options:["둘 다 시간","둘 다 장소","앞은 문서의 순서/위치, 뒤는 시간","앞은 사람, 뒤는 장소"],answer:2,exp:"같은 ‘다음’이라도 담화 맥락에 따라 지시 대상이 달라진다는 점을 확인하는 문제이다.",source:"모의고사 원문 대조 수정본 p.3"},
{id:82,cat:"모고 핵심",type:"mcq",prompt:"중세 국어 목적격 조사 선택의 기본 기준으로 가장 적절한 것은?",options:["받침 유무와 모음 조화를 함께 본다.","현대 국어와 완전히 같아 을/를만 쓴다.","무조건 만 쓴다.","어간의 품사만 본다."],answer:0,exp:"받침이 있으면 을/, 없으면 를/ 계열을 쓰고, 양성·음성 모음 조화도 고려한다.",source:"모의고사 원문 대조 수정본 p.5"},
{id:83,cat:"모고 핵심",type:"mcq",prompt:"중세 국어에서 끝음절 모음이 중성 모음 ㅣ인 체언의 목적격 조사 선택에 대한 설명으로 옳은 것은?",options:["모음 조화만 본다.","받침 유무를 중심으로 하며 을/를 계열과 / 계열이 모두 가능하다.","항상 를만 쓴다.","항상 만 쓴다."],answer:1,exp:"자료에서는 중성 모음 ㅣ의 경우 모음 조화와 무관하게 받침 유무를 중심으로 두 계열 조사가 모두 가능하다고 설명한다.",source:"모의고사 원문 대조 수정본 p.5"},
{id:84,cat:"모고 핵심",type:"mcq",prompt:"‘전쟁이 끝날 가능성’의 관형사절 성격으로 가장 적절한 것은?",options:["‘가능성’이 관형사절의 문장 성분으로 복원되는 관계 관형사절","절 전체가 ‘가능성’의 내용을 이루는 내용 관형사절","인용절","부사절"],answer:1,exp:"‘전쟁이 끝나다’라는 절 전체가 ‘가능성’의 내용이 되므로 내용 관형사절로 본다.",source:"인터넷 대조 검증본 / 6월 모평 관형사절"}
];

const cats=["전체","음운 체계","음운 변동","단어·형태소","모고 핵심","오답만"];
let activeCat="전체", current=0, order=[], quickMode=false, selected=null;
const KEY="gafs_cram_state_v3";
const state=JSON.parse(localStorage.getItem(KEY)||'{"answers":{},"name":""}');
const $=s=>document.querySelector(s);
const tabs=$("#tabs"), card=$("#questionCard"), review=$("#review");
function norm(s){return String(s??"").normalize("NFC").toLowerCase().replace(/\s+/g,"").replace(/[\[\](){},.·/'"“”‘’:;_-]/g,"")}
function save(){state.name=$("#studentName").value;localStorage.setItem(KEY,JSON.stringify(state))}
function filterQ(){
  if(quickMode) return order.map(id=>Q.find(q=>q.id===id)).filter(Boolean);
  if(activeCat==="전체") return Q;
  if(activeCat==="오답만") return Q.filter(q=>state.answers[q.id] && !state.answers[q.id].correct);
  return Q.filter(q=>q.cat===activeCat);
}
function buildTabs(){
  tabs.innerHTML=cats.map(c=>`<button class="pill ${c===activeCat&&!quickMode?"active":""}" data-cat="${c}">${c}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;quickMode=false;current=0;selected=null;buildTabs();render();});
}
function stats(){
  const vals=Object.values(state.answers);const attempted=vals.length;const correct=vals.filter(v=>v.correct).length;const wrong=attempted-correct;
  $("#attempted").textContent=attempted;$("#correct").textContent=correct;$("#wrong").textContent=wrong;$("#accuracy").textContent=attempted?Math.round(correct/attempted*100)+"%":"0%";
  $("#wrongCountBadge").textContent=wrong+"개";
}
function mark(q,correct,userAnswer){
  state.answers[q.id]={correct,userAnswer:String(userAnswer??""),ts:Date.now()};save();stats();renderFeedback(q);renderReview();updateProgress();
}
function answerText(q){return q.type==="mcq"?q.options[q.answer]:(q.answers||[])[0]}
function renderFeedback(q){
  const fb=$("#feedback"); if(!fb)return;
  const a=state.answers[q.id];
  if(!a){fb.className="feedback";fb.innerHTML="";return}
  fb.className="feedback show "+(a.correct?"ok":"bad");
  fb.innerHTML=`<div class="answer">${a.correct?"정답입니다.":"확인 필요"} · 정답: ${escapeHtml(answerText(q))}</div><div class="exp">${escapeHtml(q.exp)}</div>`;
  if(q.type==="mcq"){
    card.querySelectorAll(".option").forEach((el,i)=>{
      el.classList.remove("correct","wrong");
      if(i===q.answer)el.classList.add("correct");
      if(!a.correct && i===Number(a.userAnswer))el.classList.add("wrong");
      el.disabled=true;
    });
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
  const list=filterQ();
  $("#modeTitle").textContent=quickMode?"15문항 속성 보충":activeCat;
  if(!list.length){card.innerHTML='<div class="empty">이 범위에 표시할 문항이 없습니다.</div>';updateProgress();renderReview();return}
  if(current>=list.length)current=list.length-1;if(current<0)current=0;
  const q=list[current];selected=null;
  $("#typeBadge").textContent=q.type==="fill"?"괄호형":"객관식";
  let body="";
  if(q.context)body+=`<div class="context">${escapeHtml(q.context)}</div>`;
  if(q.type==="fill"){
    const prev=state.answers[q.id]?.userAnswer||"";
    body+=`<div class="fillrow"><input id="fillInput" autocomplete="off" value="${escapeHtml(prev)}" placeholder="괄호 안 정답 입력"><button class="action" id="checkBtn">채점</button></div><div class="hint">힌트: ${escapeHtml(q.hint||"")}</div>`;
  }else{
    body+=`<div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${i+1}.</b> ${escapeHtml(o)}</button>`).join("")}</div><div class="controls"><button class="action" id="checkBtn">선택 채점</button></div>`;
  }
  card.innerHTML=`<div class="qhead"><span class="badge">${escapeHtml(q.cat)}</span><span class="source">${escapeHtml(q.source)}</span></div>
  <div class="qbody"><div class="qnum">현재 ${current+1} / ${list.length} · 전체번호 ${q.id}</div><div class="prompt">${escapeHtml(q.prompt)}</div>${body}<div id="feedback" class="feedback"></div></div>
  <div class="qfooter"><div class="left"><button class="small" id="prevBtn">← 이전</button><button class="small unknown" id="unknownBtn">모르겠음</button><button class="small" id="retryBtn">재도전</button></div><div class="right"><button class="small primary" id="nextBtn">다음 →</button></div></div>`;
  const prevAns=state.answers[q.id];
  if(q.type==="mcq"){
    card.querySelectorAll(".option").forEach(el=>el.onclick=()=>{
      if(state.answers[q.id])return;
      card.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");selected=Number(el.dataset.i);
    });
  }
  $("#checkBtn").onclick=()=>{
    if(state.answers[q.id])return;
    if(q.type==="fill"){
      const v=$("#fillInput").value.trim();if(!v){$("#fillInput").focus();return}
      const ok=(q.answers||[]).some(a=>norm(a)===norm(v));mark(q,ok,v);
    }else{
      if(selected===null)return;mark(q,selected===q.answer,selected);
    }
  };
  $("#unknownBtn").onclick=()=>{if(!state.answers[q.id])mark(q,false,"모르겠음")};
  $("#retryBtn").style.display=prevAns?"inline-block":"none";
  $("#retryBtn").onclick=()=>{delete state.answers[q.id];save();stats();render();renderReview();};
  $("#prevBtn").onclick=()=>{current=Math.max(0,current-1);render()};
  $("#nextBtn").onclick=()=>{current=Math.min(list.length-1,current+1);render()};
  if(prevAns)renderFeedback(q);
  if(q.type==="fill"&&!prevAns)setTimeout(()=>$("#fillInput")?.focus(),20);
  updateProgress();
}
function updateProgress(){
  const list=filterQ(), done=list.filter(q=>state.answers[q.id]).length;
  $("#progressBar").style.width=(list.length?done/list.length*100:0)+"%";
  $("#progressText").textContent=`${done} / ${list.length} 완료`;
}
function renderReview(){
  const wrongs=Q.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);
  if(!wrongs.length){review.innerHTML='<div class="empty">아직 오답이 없습니다.</div>';return}
  review.innerHTML=wrongs.map(q=>`<div class="review-item"><b>#${q.id}</b><span><strong>${escapeHtml(q.cat)}</strong> · ${escapeHtml(q.prompt)}<br>정답: ${escapeHtml(answerText(q))}</span></div>`).join("");
}
$("#studentName").value=state.name||"";
$("#studentName").addEventListener("input",save);
$("#quickBtn").onclick=()=>{
  const candidates=Q.filter(q=>!state.answers[q.id]||!state.answers[q.id].correct);
  const base=(candidates.length>=15?candidates:Q).slice().sort(()=>Math.random()-.5).slice(0,15);
  order=base.map(q=>q.id);quickMode=true;current=0;activeCat="전체";buildTabs();render();
};
$("#shuffleBtn").onclick=()=>{
  const list=filterQ();order=list.map(q=>q.id).sort(()=>Math.random()-.5);quickMode=true;current=0;buildTabs();render();
};
$("#copyBtn").onclick=async()=>{
  const vals=Object.values(state.answers),attempted=vals.length,correct=vals.filter(v=>v.correct).length;
  const wrongs=Q.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct).map(q=>`#${q.id} ${q.cat} - 정답: ${answerText(q)}`);
  const txt=`[경기외고 직전보충 결과]\n이름: ${state.name||"미입력"}\n풀이: ${attempted}/${Q.length}\n정답: ${correct}\n오답·모름: ${attempted-correct}\n정답률: ${attempted?Math.round(correct/attempted*100):0}%\n\n[오답 목록]\n${wrongs.length?wrongs.join("\n"):"없음"}`;
  try{await navigator.clipboard.writeText(txt);alert("결과를 복사했습니다. 카톡 등에 붙여넣으면 됩니다.");}catch(e){prompt("아래 결과를 복사하세요.",txt)}
};
$("#resetBtn").onclick=()=>{
  if(confirm("모든 풀이 기록을 초기화할까요?")){state.answers={};save();quickMode=false;activeCat="전체";current=0;buildTabs();stats();render();renderReview();}
};
document.addEventListener("keydown",e=>{
  const q=filterQ()[current]; if(!q)return;
  if(q.type==="mcq"&&!state.answers[q.id]&&/^[1-5]$/.test(e.key)){
    const i=Number(e.key)-1,el=card.querySelector(`.option[data-i="${i}"]`);if(el)el.click();
  }
  if(e.key==="Enter"){
    if(!state.answers[q.id])$("#checkBtn")?.click(); else $("#nextBtn")?.click();
  }
});
buildTabs();stats();render();renderReview();
</script>
</body>
</html>
